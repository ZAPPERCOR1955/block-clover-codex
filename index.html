tos' shield. It goes in the off-hand so it never disarms you. Right-click raises the full dome for 22 s."}, {"name": "Bow of Euros", "tag": "Summon", "mana": 100, "cooldown": 34.0, "damage": "8 and a 2 s stun on a direct hit / the storm is 1 per blade, 66 blades, climbing with shear", "range": "Held, 8.5-block strike area", "duration": "30 s", "summary": "Euros' bow needs no arrows. A hit stuns and brings Boreas' storm in on the target. A shot into the ground rains the storm over the area."}], "rarity": "Legendary", "chance": 0.3, "id": "wind"}, {"path": "grimoire_spatial", "magic": "Spatial Magic", "wielder": "Finral Roulacase", "accent": "#c060e0", "doctrine": "Erasure scales with range, from 0.55x point-blank to 1.60x at 32 blocks. Keep your distance to deal more damage.", "spells": [{"name": "Fallen Angel Gate", "tag": "Mobility", "mana": 60, "cooldown": 18.0, "damage": "None", "range": "20 blocks aimed, 10 crouching", "duration": "12 s", "summary": "Tap once to open a portal where you are looking and again to open its pair. The two link and stay open, keep your momentum and carry allies too, and can hang in the air. The mana and cooldown are paid on the second tap. Hold for 5 s to open the gate map and pick any place in this world by its coordinates. That gate costs 1 more mana for every 5 blocks, stays open 10 s and puts the spell on a 60 s cooldown. The map does not work in dungeons, the arena, duels, events or outside the overworld, or for 60 s after you spawn."}, {"name": "Fallen Angel Flapping", "tag": "Control", "mana": 55, "cooldown": 16.0, "damage": "None", "range": "26-block lock, throws 24 blocks, carries 14", "duration": "2.5 s of pursuit", "summary": "A fast homing mass. A hostile it touches is thrown the way you are looking when it lands, further with range points. Allies and you are carried forward. Cast it looking straight down to step 14 blocks in a random direction instead. Only cover stops it."}, {"name": "Archangel Shootdown", "tag": "Barrage", "mana": 50, "cooldown": 11.0, "damage": "5 x 9 spheres before reach, about 25 point-blank, 72 extended, more with return passes", "range": "46 blocks, fast homing, pierces 3", "duration": "None", "summary": "Nine small spheres form in a ring and launch in sequence. Any that hits without killing swings past and returns for one more pass."}, {"name": "Spatial Slash", "tag": "Strike", "mana": 90, "cooldown": 20.0, "damage": "36 before reach, about 20 point-blank, 58 at 32 blocks", "range": "26 blocks, 100 degree fan, through walls", "duration": "None", "summary": "A wide flat cut that hits everything in front of you at once. It goes through walls and through shield spells, but not through barriers. It also deletes enemy shots and flying spells in its path."}, {"name": "Archangel Destruction", "tag": "Ultimate", "mana": 180, "cooldown": 40.0, "damage": "None", "range": "Self, shots within 4.5 blocks", "duration": "10 s", "summary": "Holes open around you and swallow every shot and flying spell thrown at you. Beams and melee still reach you, and so does anti-magic. Your own shots and your allies' pass."}], "rarity": "Common", "chance": 5.0, "id": "spatial"}, {"path": "grimoire_world_tree", "magic": "World Tree Magic", "wielder": "William Vangeance", "accent": "#7fd65a", "doctrine": "The tree drains what it binds and spends it on what it shelters. Sap caps at 100 and pays for the heals.", "spells": [{"name": "Mistilteinn Seed", "tag": "Strike", "mana": 50, "cooldown": 12.0, "damage": "7 on impact, 4 per crush, each crush 26% harder than the last", "range": "26 blocks, homing", "duration": "2 s cage", "summary": "A homing seed that cages what it hits and starts draining it. A player it lets go of cannot be held by it again for 5 s."}, {"name": "Dracaena Formation", "tag": "Zone", "mana": 80, "cooldown": 20.0, "damage": "5 per crush, each 26% harder than the last", "range": "6.5 blocks", "duration": "5.5 s", "summary": "Roots erupt around the caster and hold everything standing in them."}, {"name": "Magic Warding Ash", "tag": "Guard", "mana": 130, "cooldown": 32.0, "damage": "None", "range": "22 blocks placed, 6 radius, 10 tall", "duration": "13 s", "summary": "A ward of ash that shelters what stands inside it."}, {"name": "Mistilteinn Blade", "tag": "Summon", "mana": 220, "cooldown": 84.0, "damage": "18 a swing, up to +7.5 edge from sap", "range": "6-block handover", "duration": "45 s, or 80 s funded by sap", "summary": "Draws a blade of the tree out of the grimoire and can hand it to a party or squad mate within six blocks."}, {"name": "Budding of Yggdrasil", "tag": "Ultimate", "mana": 260, "cooldown": 85.0, "damage": "Heals 16% every second", "range": "21-block radius, 46 tall", "duration": "9.5 s", "summary": "The tree itself comes down out of the sky over you. Once it lands, you, your party and your squad are mended under the canopy for as long as it stands."}], "rarity": "Uncommon", "chance": 3.1, "id": "world-tree"}, {"path": "grimoire_curse", "magic": "Curse-Warding Magic", "wielder": "Megicula / Vanica Zogratis", "accent": "#c9184a", "doctrine": "Curses work as conditions. This grimoire strips what a target relies on, holds them in place and rots them where they stand. Its one spell with a real damage number has a one-second fuse.", "spells": [{"name": "Decaying World", "tag": "Control", "mana": 60, "cooldown": 10.0, "damage": "6 on contact, Wither II for 8 s, then 2 a second to anything inside the ring, and a fifth of it comes back as health", "range": "9-block sweep, up to 6 bodies, then a 5-block ring", "duration": "2 s bind, 8 s rot, 6 s ward and ring", "summary": "Rune strands lash out, hold everything they reach in place and strip every buff off it. A rune ring is left on you and follows you for six seconds, rotting anything that stays inside it a beat at a time. A fifth of everything the strands and the ring deal comes back to you as health, up to 2 hearts a tick however many bodies they touch. You also take 35% less for the same six seconds, whether or not the strands caught anybody. Most of the damage is in the ring, and walking out of the ring avoids it. A player it lets go of cannot be bound by it again for 5 s."}, {"name": "Exploding Life", "tag": "Strike", "mana": 45, "cooldown": 8.0, "damage": "13 at the centre (the target itself takes about 11.6), half at the rim, about 5 to the two nearest bodies within 7", "range": "24 blocks", "duration": "1 s fuse", "summary": "Two rune circles clamp round the target's stomach, and one second later the charge inside them goes off wherever the target is standing at that moment. It jumps to the two nearest others. Moving out of it during the fuse costs the target their position."}, {"name": "Unbound Slave", "tag": "Control", "mana": 70, "cooldown": 16.0, "damage": "1.6 a second for the whole window (about 18 in all), and every curse that lands on the marked body while it wears the array does 30% more", "range": "20 blocks, single target", "duration": "12 s", "summary": "An array is written on one target and feeds on it for a little under two damage a second for twelve seconds. While it is worn, curse magic deals 30% more to that body. It gives no control over the target. Mark what you intend to kill, then finish it with the rest of the book. An Exploding Life on a marked body deals about 15 instead of 11.6, and the decay ring hits it harder for as long as it stands in one."}, {"name": "Curse-Warding Recovery", "tag": "Restore", "mana": 80, "cooldown": 26.0, "damage": "Half of every hit aimed at the caster is moved onto the mark, a fifth of that comes straight back, and half of everything the mark takes at all comes back when the link closes, up to 16", "range": "18 blocks, single target", "duration": "10 s link, ward and regen", "summary": "Marks one body at range. For ten seconds half of every hit aimed at you lands on the mark instead, and a fifth of that moved damage comes back to you as health the moment it lands. Everything the mark takes from any source is also counted, and when the link closes (time runs out or the mark dies) you are healed for half the total at once. A killing blow during the window leaves you on 3 hearts instead. A miss still gives the regeneration and the revival, but opens no link."}, {"name": "Malevolent Femcantation", "tag": "Ultimate", "mana": 220, "cooldown": 75.0, "damage": "5 a lash every 1.5 s, then 26 in 8 blocks as it closes, and a fifth of it comes back as health", "range": "Self, the devil reaches 20", "duration": "20 s", "summary": "Megicula half-manifests off your shoulder and attacks whatever is nearest on its own. You do not aim it. For the whole twenty seconds you take 35% less and heal for a fifth of everything the devil lands. When the bridge collapses at the end it deals the largest single hit in the grimoire."}], "rarity": "Common", "chance": 5.0, "id": "curse"}, {"path": "grimoire_beast", "magic": "Beast Magic", "wielder": "Vetto / Yrul", "accent": "#e8a94e", "doctrine": "Beast Magic is an aura worn on your own body. Only Hunting Fangs leaves you, torn off your hands and thrown. Each spell is meant for a specific moment, so do not just press them on cooldown.", "spells": [{"name": "Bear Claw", "tag": "Strike", "mana": 50, "cooldown": 7.0, "damage": "15 in the arc", "range": "5.5 blocks to the nearest part of a body, ~240-degree arc", "duration": "25 ticks of exposure", "summary": "Three vertical cuts brought down in front of you. The grimoire's biggest single swipe, and it shatters projectiles caught in it. For 1.25 s afterwards you take 35% more damage."}, {"name": "Hunting Fangs", "tag": "Barrage", "mana": 55, "cooldown": 10.0, "damage": "6 a fang, 18 if all three land", "range": "36 blocks to lock on, the fangs fly about 40", "duration": "None", "summary": "Three crescent fangs leave your hands one after another, fanned out to either side, and curve in on the enemy under your crosshair. They turn only so fast, so a target that gets behind one loses it, and walls stop them. Thrown at nothing they go out as a tight spread and go for the first enemy they find ahead."}, {"name": "Rhinoceros Armor", "tag": "Guard", "mana": 60, "cooldown": 20.0, "damage": "14 a gore, 1.1 s per victim", "range": "Self, contact", "duration": "18 s or 3 hits", "summary": "Blocks any single hit of 6 or more completely and does nothing against smaller ones. It also grows a horn, giving Strength II and Speed II, and anything you walk into is gored."}, {"name": "Bogeyman", "tag": "Summon", "mana": 65, "cooldown": 18.0, "damage": "10 a touch, then +30% from everything", "range": "Cast anywhere, they cross 40 blocks to a fight", "duration": "20 s", "summary": "Summons two tall, thin, barely visible phantoms that keep station behind you and go for whatever you are fighting. Their fists hit for 10, and what they touch is left Terrified and takes 30% more from everything. They can be killed."}, {"name": "Holy Howling", "tag": "Ultimate", "mana": 130, "cooldown": 45.0, "damage": "32 in the roar", "range": "9 blocks, centred on the caster", "duration": "8 s terror, 10 s regen", "summary": "An instant roar from your own body. Everything hostile in earshot is thrown back and left Terrified, taking 30% more from everything. The howl also purifies, and you and every ally within 14 blocks regenerate. It is Beast's only healing."}], "rarity": "Common", "chance": 5.0, "id": "beast"}, {"path": "grimoire_bone", "magic": "Bone Magic", "wielder": "Zenon Zogratis", "accent": "#e6e0c8", "doctrine": "Every cast costs you health, and every separate body a bone pierces heals part of it back, once per body per second.", "spells": [{"name": "Eternal Fangs", "tag": "Strike", "mana": 45, "cooldown": 11.0, "damage": "14.28 per body pierced", "range": "9-block cone, roughly 50 degrees off the look", "duration": "None", "summary": "Costs 5.18 health. Countless bones out of the chest at once. You come out a little behind on one target, ahead on two, and it is a good opener on four."}, {"name": "Multiple Bone Spears", "tag": "Strike", "mana": 35, "cooldown": 9.0, "damage": "7.14 per body pierced, 6 spears", "range": "35 to 50 blocks of flight, each spear runs through every body on its line", "duration": "None", "summary": "Costs 3.45 health. A tight volley thrown a long way. It works best down a corridor and worse into a crowd."}, {"name": "Bone Cage", "tag": "Control", "mana": 65, "cooldown": 16.0, "damage": "6.25 to close, then 12.5 over the hold", "range": "24 blocks, needs a target", "duration": "2 s", "summary": "Costs 4.6 health. The teeth close and hold. The occupant cannot walk or jump, but keeps their aim, swing and grimoire. A player it lets go of cannot be held by it again for 5 s."}, {"name": "Bone Armor", "tag": "Guard", "mana": 160, "cooldown": 40.0, "damage": "2.14 per spur to anything in reach, once a second", "range": "2.3-block spur reach", "duration": "18 s", "summary": "Costs 6.9 health and hands back 1.75x what was actually paid as absorption, plus Resistance. The lower your health, the less it gives."}, {"name": "Demon Sword Dainsleif", "tag": "Ultimate", "mana": 240, "cooldown": 60.0, "damage": "26.78 per cut, two crossing cuts", "range": "26 blocks long, 2.4 half-width", "duration": "None", "summary": "Costs 10.35 health, the highest health cost in the grimoire. Cutting through three bodies in a corridor leaves you healthier than you started."}], "rarity": "Rare", "chance": 1.9, "id": "bone"}, {"path": "grimoire_legion", "magic": "Legion Magic", "wielder": "Princia Funnybunny", "accent": "#9b5cf0", "doctrine": "Legion has no meter. Its resource is the soldiers themselves, standing in the world where you can see them, up to twelve at once for forty to fifty seconds each. Every blow a soldier lands counts as your Legion magic. It scales with your Magic Damage and the slot's Damage upgrade, goes through armour, shows your damage number, and the kill is yours. Two spells make soldiers, End Empress and Grand Gambit spend them, and Blink Castling cannot be used with none on the field. A soldier that falls behind you runs to catch up, and one left far behind blinks back to your side.", "spells": [{"name": "Gehenna Game", "tag": "Summon", "mana": 35, "cooldown": 9.0, "damage": "7 as the board lands, 2.5 a punch per pawn every 0.75 s", "range": "A 4.2-block board at your feet", "duration": "40 s", "summary": "Four pawns scatter off a disc that slams down under you, and everything on it is hit and thrown out to the rim. The pawns grow to full size, then fight. They have the quickest fists in the army and 28 health each. Casting into a full field does nothing and costs nothing."}, {"name": "Blink Castling", "tag": "Mobility", "mana": 18, "cooldown": 5.0, "damage": "9 round the square you land on", "range": "Any soldier you are looking at, out to 48 blocks", "duration": "2.5 s of speed and resistance", "summary": "Swap places with a soldier. Both bodies move, so whatever was about to land on you lands on the soldier instead, which is healed a third and braced. You arrive with a strike that hits and throws back everything within 3.2 blocks, and you are faster and harder to hurt for a moment. Everything within 9 blocks that was hunting you switches to the soldier. With no soldier standing it does nothing and costs nothing."}, {"name": "Grand Gambit", "tag": "Detonation", "mana": 50, "cooldown": 14.0, "damage": "Each soldier's remaining health, in a blast (a fresh rook 80, knight 38, pawn 28), half at the rim, x0.55 for each further blast on the same body", "range": "Every soldier you have out to 48 blocks, blasts 2.8 to 3.8 blocks", "duration": "0.7 s fuse, then one every 0.1 s", "summary": "Every soldier standing is primed at once. Each runs at the nearest enemy within 8 blocks and, after a short fuse, explodes for its remaining health, in a chain outward from you, nearest first. A crowd takes every blast in full, but one body caught in several takes each at a little over half the one before. Gehenna Game and Endless Domination both go on their full cooldowns, so the army cannot be rebuilt and spent again straight away. With no soldier standing it does nothing and costs nothing."}, {"name": "Endless Domination", "tag": "Summon", "mana": 120, "cooldown": 34.0, "damage": "10 as the board lands, rook 4.5 a slam (60% to all round it), knight 6 a lance, x1.6 at the end of a charge", "range": "A 7.4-block board placed within 18", "duration": "50 s, the board holds 18 s", "summary": "Two rooks and two knights come off a giant board that slams down on whatever it is laid on. Rooks shake the ground round every blow, and knights charge anything 5 to 13 blocks off. While the board holds, everything hostile standing on it is slowed and weakened, and it replaces its own losses up to four times. Pieces you spend on Grand Gambit or End Empress do not count as losses."}, {"name": "End Empress", "tag": "Mode", "mana": 250, "cooldown": 60.0, "damage": "Your melee x1.7 + 9, and 70% of it swept across everything in front of you", "range": "Self, 5-block arc", "duration": "12 s empty, up to 30 s fed", "summary": "Folds every soldier standing into one five-block suit of armour that you wear. Duration, ablative armour and size all scale with the soldiers that went in. The suit takes 18% off every hit before the armour eats its share, so it also holds together longer. Her swing hits hard even with an empty hand, and she moves a quarter faster. Press again to shed it."}], "rarity": "Common", "chance": 5.0, "id": "legion"}, {"path": "grimoire_briar", "magic": "Briar Magic", "wielder": "Charlotte Roselei", "accent": "#6e86d8", "doctrine": "Briar barely deals damage on its own. It binds, and the thorns hurt the victim for every block they move, at 0.55 per block per thorn with up to 5 thorns. That is about 9 a second at three thorns on someone sprinting. Standing still in a briar patch costs nothing at all. Fire counters it, since a burning body sheds its briars on the spot.", "spells": [{"name": "Briar Spike", "tag": "Zone", "mana": 25, "cooldown": 6.0, "damage": "5 on contact, then 1 thorn", "range": "6 patches out to 14 blocks, 1.7 radius each", "duration": "4.5 s of thorns", "summary": "A cheap way to make ground painful to cross. The patches erupt one by one away from you, along the ground in the direction you face, so aiming at the sky does nothing."}, {"name": "Scarlet-Braided Battle Spear", "tag": "Strike", "mana": 40, "cooldown": 9.0, "damage": "11 per body, pierces everything on the line", "range": "About 30 blocks, mid-range", "duration": "2 thorns", "summary": "The only spell here that deals real damage. It is braided in your hands for half a second, then thrown wherever you are aiming at that moment."}, {"name": "Blue Rose Paradise", "tag": "Zone", "mana": 105, "cooldown": 26.0, "damage": "2.5 twice a second to everything inside, 2 thorns", "range": "6.5-block garden, placed within 18", "duration": "11 s", "summary": "The roses keep shooting petals at anything standing in the garden, so standing still here still hurts, but the garden cannot follow you. The vines also pull one harmful effect a second off every ally on the roses."}, {"name": "Binding Rose", "tag": "Control", "mana": 55, "cooldown": 14.0, "damage": "1.6 every half second while caged, 4 thorns", "range": "22 blocks, single target", "duration": "2 s rooted, 5 s scent", "summary": "A trap. Vines break the floor, close on one body, hold it (no walking, no knockback), bleed it, then sink back. The only damage over time in the grimoire. The rose scent also puts Blindness and Nausea on the target and anything crowded against it. A cast that catches nobody still grows and sinks. A player it lets go of cannot be held by it again for 5 s."}, {"name": "Queen of Briars", "tag": "Mode", "mana": 220, "cooldown": 55.0, "damage": "None directly, +2 thorns on every other briar spell", "range": "Self", "duration": "20 s", "summary": "True Briar Magic, a dress and crown of briars. Grants Resistance III, Strength II, Speed II, Haste II, Regeneration II and Health Boost III, and every other briar spell adds two more thorns."}], "rarity": "Common", "chance": 5.0, "id": "briar"}, {"path": "grimoire_vez", "magic": "Vez Magic", "wielder": "Vez", "accent": "#ffd24a", "doctrine": "Five different attacks at five different reaches. There is a grapple at 14 blocks that hauls things in, a hitscan beam at 56, a volley at 36 that plants a field and detonates it all at once, an emplacement at 64, and something dropped out of the sky that goes off twice. There is no meter and no set order. Three of the five wind up, and each aims differently. Heaven's Rebuke tracks through its charge and locks on the shot, Empyrean Array locks the moment you press it, and Astral Lances re-aim for every spear.", "spells": [{"name": "Sovereign's Chains", "tag": "Grapple", "mana": 75, "cooldown": 13.0, "damage": "24 on the bite, 15 every 12 ticks while hauled, then 78 on the crush", "range": "14 blocks, forward arc, the crush is 5 around you", "duration": "1.7 s of haul", "summary": "Six hooks come out of the book and bite whatever is nearest, one chain per body, up to six bodies. For the next second and three quarters everything caught is dragged toward you and squeezed on a beat, then the chains snap taut and crush them all, along with anything standing in the blast at your feet. It is the grimoire's only close-range spell and the only one that pulls enemies toward you, so the crush goes off right on top of you. Use it on something already close. It is also the book's only way to stop something walking away."}, {"name": "Heaven's Rebuke", "tag": "Beam", "mana": 120, "cooldown": 22.0, "damage": "72 to everything on the line, then 138 at the impact falling to 69 at the rim", "range": "56 blocks, 8.5-block blast", "duration": "1.6 s of wind-up", "summary": "The floor under you floods white, six chained tablets spiral down to your chest, and then a single beam fires. The beam is hitscan and reaches the far end on the frame it appears. The aim tracks for the whole wind-up and locks when it fires, so you can keep aiming while it charges. It leaves the ground intact, and nothing in this grimoire breaks blocks."}, {"name": "Astral Lances", "tag": "Field", "mana": 130, "cooldown": 15.0, "damage": "18 a spear on the way in, then 27 from every planted spear when the field goes off", "range": "36 blocks, each planted blast reaches 3.4", "duration": "2.1 s to empty, then the field detonates together", "summary": "Fourteen gold spears hang point-down over your head and leave one at a time, each aimed at whatever you are looking at as it leaves. A spear that lands stays standing where it stopped, with a burning circle at its foot that widens as its fuse runs down, and a little over a second after the last one comes down the whole field detonates at once. Sweep the crosshair across a floor to cover it with fourteen overlapping blasts, or hold it on one body to stack them all on that target."}, {"name": "Empyrean Array", "tag": "Emplacement", "mana": 200, "cooldown": 40.0, "damage": "60 to anything on the line, then 180 at the detonation falling to 81 at the rim", "range": "13-block barrel, up to 64 blocks, 13-block detonation", "duration": "2 s to assemble", "summary": "Seven magic circles build themselves into a barrel on the line you were facing, narrowing from four and a half blocks across at the back to one at the front. Then a beam threads the whole barrel and detonates. The aim is set when you press and never changes, so unlike Heaven's Rebuke you have to predict where the target will be. The barrel gives two seconds of very obvious warning. You are free to walk away from it."}, {"name": "Fallen Star", "tag": "Ultimate", "mana": 240, "cooldown": 80.0, "damage": "132 at the landing, then 21 every 15 ticks for 5 s, then 174 when it caves in", "range": "40 blocks out, 12-block impact, 9-block burn, 15-block collapse", "duration": "About 9.5 s end to end", "summary": "A gate opens forty-six blocks above whatever you were looking at, and a five-block sphere of chained black plates comes through it, accelerating all the way down. When it lands it stays there, embedded and burning, and hits everything near it every fifteen ticks while its shell cracks further open, until it caves in with a second, wider detonation. It is aimed when you press and does not track, so the target has the whole fall to get out of the way."}], "rarity": "Mythic", "chance": null, "id": "vez"}, {"path": "grimoire_star", "magic": "Star Magic", "wielder": "Yuno Grinberryall", "accent": "#3d8bff", "doctrine": "Every spell is drawn between stars you set in the air, and a beam loses strength for each of its stars destroyed before it fires. The four white stars are quick. The five black stars carry anti-magic, so their beam goes through shield spells and their whip cuts enemy spells apart.", "spells": [{"name": "Quartile Hasta", "tag": "Beam", "mana": 30, "cooldown": 7.0, "damage": "12 per body, a quarter less for each star destroyed", "range": "36 blocks, pierces 3", "duration": "0.4 s to form", "summary": "Four stars light up in front of you and pour into one beam that fires where you are looking when it forms. It stops at the first block."}, {"name": "Quartile Flagellum", "tag": "Sweep", "mana": 45, "cooldown": 11.0, "damage": "17 per body, every body in the swing", "range": "16-block whip, 210 degree swing", "duration": "None", "summary": "A thin line of starlight strung through four stars and swung level across everything in front of you. It cuts every body it crosses, even through up to 3 blocks of wall."}, {"name": "Quartile Scutum", "tag": "Guard", "mana": 75, "cooldown": 18.0, "damage": "Blocks 40 from the front, no spell takes more than 30", "range": "4 x 2.8 wall, 2.6 blocks ahead", "duration": "7 s", "summary": "Four stars and the light between them stand as a wall in front of you that turns with your aim. Hits from the front are stopped and shots are destroyed. A single spell costs it no more than 30, so the biggest spells are stopped whole. A corner star goes dark for every quarter used. Anti-magic goes straight through, and a blow from inside the wall still lands."}, {"name": "Quintile: Atrum Hasta", "tag": "Beam", "mana": 95, "cooldown": 22.0, "damage": "7 every 0.25 s, 35 in all, a fifth less for each star destroyed", "range": "64 blocks, steered", "duration": "0.9 s charge, 1.2 s beam", "summary": "Five black stars gather into a black sphere and fire one huge beam that you steer as it burns. It goes through shield spells. Barriers still stop it, and nothing within 3 blocks of you is hit."}, {"name": "Quintile: Atrum Flagellum", "tag": "Ultimate", "mana": 200, "cooldown": 45.0, "damage": "8 a lash for 5 lashes, then 24 as it cracks", "range": "Up to 28 blocks out, 6 blocks round the spot, 6.5 at the crack", "duration": "2.5 s", "summary": "Five black stars fly from your hand and stand round the spot you aim at, or round an enemy in your sights. A black whip strings them into a pentagram one lash at a time, and each lash hits everything inside. Then the stars fall in and the whole thing cracks. Every enemy shot, wall and trap inside is cut apart. It cannot cut barriers, summons, spells worn on a body or anti-magic."}], "rarity": "Epic", "chance": 0.9, "id": "star"}, {"path": "grimoire_shadow", "magic": "Shadow Magic", "wielder": "Nacht Faust", "accent": "#9c8fd0", "doctrine": "Shadows become hands that reach and hold, doubles that rise out of your own shadow, and doors you can walk through. The hands hit everything they touch, the garden holds a crowd in place, and the corridor joins any two places in this world.", "spells": [{"name": "Grasping Shadows", "tag": "Barrage", "mana": 25, "cooldown": 6.0, "damage": "3 an arm, 5 arms, each arm hits a body once", "range": "14 blocks, pierces", "duration": "None", "summary": "Five small dark circles open round you and an arm of shadow shoots out of each toward where you are looking, a hand at its tip. The arms follow your view while they are out, so you can sweep them across a crowd. Each arm hits everything it touches. A wall stops an arm where it meets it."}, {"name": "Doppelganger", "tag": "Strike", "mana": 50, "cooldown": 12.0, "damage": "7 a double, 3 doubles", "range": "16 blocks", "duration": "About 1.3 s", "summary": "Three shadow doubles of you rise out of your own shadow, each with a curved blade. They dash out in a fan toward the enemy in your sights, or the spot you are looking at, and cut everything they pass through. They meet there in a crossed slash and sink into the ground as smoke."}, {"name": "Shadow Corridor", "tag": "Mobility", "mana": 40, "cooldown": 60.0, "damage": "None", "range": "Any place in this world by its coordinates", "duration": "10 s", "summary": "Type the coordinates of any place in this world and two mouths of shadow open, one in front of you and one on the ground there. Walking into either takes you out of the other, allies too, for 10 s. It costs 1 more mana for every 5 blocks. It does not work in dungeons, the arena, duels, events or outside the overworld, or for 60 s after you spawn, and it will not open past the world border or within 300 blocks of a world boss, a dungeon entrance or an event."}, {"name": "Dark Garden Invitation", "tag": "Zone", "mana": 80, "cooldown": 20.0, "damage": "4 on the grab, 4 more on the release", "range": "9 blocks round you", "duration": "Holds 4 s", "summary": "You press a hand to the floor and a pool of shadow full of arms spreads out round you. Arms rise out of it and coil up every enemy standing in it to the shoulders, holding them in place for four seconds before they loosen, pull down and let go."}, {"name": "Monument of Atonement", "tag": "Ultimate", "mana": 200, "cooldown": 45.0, "damage": "36 under the tomb, 12 round it", "range": "Up to 48 blocks out, 2.2 blocks under the slab, 4.5 round it", "duration": "1.5 s to fall", "summary": "The enemy under your crosshair is frozen in place the moment you cast. The base of a black tomb rises out of the ground under them, or under the spot you are looking at, and hands come up out of it and hold every enemy on it. Its huge gravestone lid comes down on them from above and crushes them, and the hands let go as it lands. Then the closed tomb sinks into the ground and leaves a circle of runes behind."}], "rarity": "Epic", "chance": 0.9, "id": "shadow"}, {"path": "grimoire_image", "magic": "Image Magic", "wielder": "Image", "accent": "#ff8fb8", "doctrine": "Five spells with five shapes. A katana cut round you, a line of gates down the way you face, cranes that pick their own targets, a tree you plant where you look, and a dragon out of the sky. There is no meter and no set order. This grimoire cannot be rolled, rerolled or found. It only comes from the creative menu or a command.", "spells": [{"name": "Hanafubuki Iai", "tag": "Strike", "mana": 45, "cooldown": 8.0, "damage": "16 to everything the sweep passed through", "range": "8.5 blocks, the front half round you and a bit more", "duration": "About 1.2 s from draw to click", "summary": "A katana appears at your hip in a black lacquer scabbard and is drawn in one sweep across everything in front of you. Nothing is hurt yet. When the blade clicks back into the scabbard, everything the sweep passed through is cut at once, thrown back and showered in petals, and the floor in front of you splits three ways. Turning while you draw widens the cut."}, {"name": "Senbon Torii", "tag": "Line", "mana": 80, "cooldown": 15.0, "damage": "13 to anything in a gate as it rises", "range": "10 gates, about 24 blocks", "duration": "3 s standing", "summary": "Ten vermilion torii gates burst up out of the floor one after another down the way you are facing, breaking the ground as they come. Anything standing in a gate when it rises is hurt and thrown up into the air and on down the path. The gates stand as a corridor for three seconds and then sink back into the ground from the far end."}, {"name": "Senbazuru", "tag": "Volley", "mana": 90, "cooldown": 16.0, "damage": "6.5 a crane, 2.6 to anything beside the one it strikes", "range": "Seeks up to 32 blocks", "duration": "About 2 s to empty the ring", "summary": "Twelve paper cranes fold out of the open grimoire and circle over your head, then peel off one after another and dive at whatever is in front of you, bursting into petals on what they strike. They choose their own targets, sharing out over the four bodies nearest your crosshair. With nobody in reach they fly to the spot you were looking at."}, {"name": "Eien no Sakura", "tag": "Zone", "mana": 130, "cooldown": 28.0, "damage": "10 when it erupts, 4 a second under the canopy, then 15 when it scatters", "range": "Planted within 24 blocks, 8-block canopy", "duration": "6 s", "summary": "A cherry tree breaks up out of the ground where you are looking, throwing the floor around it into the air. It blooms and stands for six seconds raining petals. Once a second a pulse runs out from the trunk that hurts enemies under the canopy and mends you and your allies by a heart. At the end the whole canopy is blown apart in one last gust."}, {"name": "Oka Ryujin", "tag": "Ultimate", "mana": 240, "cooldown": 75.0, "damage": "160 at the dive falling to 80 at the rim, 14 every half second in the storm, then 120 at the burst", "range": "40 blocks out, 11-block impact, 9-block storm", "duration": "About 11 s end to end", "summary": "A great crest opens in the sky over the spot you were looking at and a cherry blossom dragon pours out of it. It coils down around the field in a wide spiral and dives head first into the ground, breaking it open. Moments later it bursts back up out of the same spot inside a storm of petals that drags everything nearby inward, spirals up through it, and bursts into blossom at the top."}], "rarity": "Mythic", "chance": null, "id": "image"}], "races": [{"name": "Human", "weight": 70, "desc": "Common race of the Clover Kingdom. The only race that can host a devil.", "dash": "A quick dash the way you are moving, or forward.", "leap": "A leap forward, a lot further than a jump."}, {"name": "Dwarf", "weight": 18, "desc": "Stocky craftsmen of the Diamond Kingdom. They wield two grimoires at once. Spells from the second grimoire take 50% longer to come back and deal 15% less damage. A dwarf who carries anti-magic has no mana for a second magic, so their second grimoire does nothing.", "dash": "A short dash that ends in a small blast. 13 damage to everything close by.", "leap": "A low leap that lands with a small blast. 15 damage to everything close by."}, {"name": "Elf", "weight": 9, "desc": "Mana-rich race once thought extinct. Starts with +12500 Max Mana, +25 Mana Regen, +25% Magic Damage and +25% Magic Defense. Max Mana goes 50% higher than anyone else's, Magic Damage and Magic Defense up to 65%, and Mana Regen up to 100 where anyone else stops at 75.", "dash": "A dash straight where you aim, up into the air as well.", "leap": "The longest and highest leap of any race."}, {"name": "Devil", "weight": 3, "desc": "Rare descendants of the underworld. Starts with +150 Health, +25% Physical Damage and +25% Physical Defense. Health goes 50% higher than anyone else's, and Physical Damage and Physical Defense up to 65%.", "dash": "A long dash the way you are moving, or forward. The longest dash of any race.", "leap": "A leap forward that carries much further than a human one."}], "paths": [{"id": "ki", "name": "Ki", "blurb": "Read the field before acting on it. Ki senses what is nearby, and Zetten aims the same discipline down a blade."}, {"id": "mana", "name": "Mana", "blurb": "Mana Skin wears your own mana as a layer. Mana Zone is the same craft turned outward, onto the mana already in the air."}, {"id": "spirit", "name": "Spirit", "blurb": "A spirit agrees to walk with you. In Half Spirit Mode it lends you one wing and half its crown and helps your spells. In Full Spirit Mode it dives into you and you fight as one."}, {"id": "devil", "name": "Devil", "blurb": "Devil Mode is borrowed strength. Devil Union is the same devil sharing rather than lending. Humans only, because nothing else can host a devil."}], "modes": [{"name": "Ki", "kind": "Technique", "path": "Ki path", "mana": 0, "drain": 0, "mult": "—"}, {"name": "Zetten", "kind": "Technique", "path": "Ki path", "mana": 0, "drain": 0, "mult": "—"}, {"name": "Mana Skin", "kind": "Technique", "path": "Mana path", "mana": 20, "drain": 2, "mult": "—"}, {"name": "Mana Zone", "kind": "Technique", "path": "Mana path", "mana": 50, "drain": 4, "mult": "—"}, {"name": "Half Spirit Mode", "kind": "Technique", "path": "Spirit path", "mana": 20, "drain": 2, "mult": "—"}, {"name": "Spirit Mode", "kind": "Technique", "path": "Spirit path", "mana": 30, "drain": 3, "mult": "—"}, {"name": "Devil Mode", "kind": "Devil", "path": "Devil path (Humans only)", "mana": 0, "drain": 0, "mult": "0.8"}, {"name": "Devil Union", "kind": "Devil", "path": "Devil path (Humans only)", "mana": 0, "drain": 0, "mult": "1.4"}], "events": [{"id": "world_boss", "name": "World Boss", "desc": "One of the Clover Kingdom's greatest threats has surfaced in the wild. Anyone who lands a blow shares the spoils."}, {"id": "raid_boss", "name": "Raid Boss", "desc": "Sign up to be sent to Hage Village, where the Ancient Demon rises in the wheat fields. Up to 20 mages fight it together."}, {"id": "koth", "name": "King of the Hill", "desc": "One of the kingdom's three hilltop forts is contested. Nobody signs up, so travel there and take the point. You score only while you are the last mage standing on it."}, {"id": "hage_breach", "name": "Hage Breach", "desc": "Enemies are breaking through on the edge of Hage Village. Nobody signs up, so travel to the breach and help fight off the waves."}, {"id": "swarm", "name": "Swarm", "desc": "Sign up to be sent to the Magic Knights entrance exam arena and hold it against ten waves of bandits, wolves, mages, witches and swordsmen."}, {"id": "broom_race", "name": "Broom Race", "desc": "Sign up to be sent to one of two broom courses. Fly through every gate, fastest time wins. Every gate you miss adds a time penalty."}, {"id": "ffa", "name": "Free For All", "desc": "Sign up to be scattered across Hage Village with every other mage who signed up. Last one standing wins. Nobody loses anything they were carrying."}, {"id": "tdm", "name": "Team Deathmatch", "desc": "Squad against squad in the Hage arena. Anyone can sign up, and you can still walk in once it has started. Your squad is your team, and a squadless mage is put on the thinnest side."}], "quests": [{"type": "Daily", "name": "Monster Hunt", "desc": "Monsters are getting bold out there. Go thin them out a bit.", "obj": "Defeat hostile mobs"}, {"type": "Daily", "name": "Road Warden", "desc": "Travellers keep getting jumped on the roads. Deal with the bandits, rogue mages, witches and swordsmen out in the wild.", "obj": "Defeat bandits, mages, witches or swordsmen"}, {"type": "Daily", "name": "Blade Work", "desc": "Magic isn't everything. Fight with a weapon or your fists for a change.", "obj": "Defeat hostile mobs without magic"}, {"type": "Daily", "name": "Spell Practice", "desc": "A grimoire only gets stronger if you use it. Put some practice in today.", "obj": "Cast spells"}, {"type": "Daily", "name": "Sky Patrol", "desc": "Take your broom out and cover some ground.", "obj": "Blocks flown on a broom"}, {"type": "Daily", "name": "Arena Regular", "desc": "Step into the arena and fight ranked matches. Win or lose, they all count.", "obj": "Finish ranked arena matches"}, {"type": "Daily", "name": "Join the Fun", "desc": "Take part in a server event. A new one starts every half hour, check the Events page.", "obj": "Take part in a server event"}, {"type": "Daily", "name": "Push Your Limits", "desc": "A mode only gets easier the more you use it. Raise yours a few times today.", "obj": "Raise a mode"}, {"type": "Weekly", "name": "Regular Duty", "desc": "Keep up with your daily quests this week.", "obj": "Finish daily quests"}, {"type": "Weekly", "name": "Champion", "desc": "Win a server event this week. In a team event, a win for your side counts.", "obj": "Win server events"}, {"type": "Weekly", "name": "Event Regular", "desc": "Show up for the server events this week.", "obj": "Take part in server events"}, {"type": "Weekly", "name": "Gladiator", "desc": "Climb the arena ladder. Win ranked matches this week.", "obj": "Win ranked arena matches"}, {"type": "Weekly", "name": "Dungeon Delver", "desc": "Clear dungeons this week. You have to be inside when the boss falls.", "obj": "Clear dungeons"}, {"type": "Weekly", "name": "Boss Slayer", "desc": "Help bring down bosses this week. Any boss counts as long as you were in the fight.", "obj": "Defeat bosses"}, {"type": "Weekly", "name": "Long Haul", "desc": "Put some real distance on your broom this week.", "obj": "Blocks flown on a broom"}], "story": [{"name": "Sense The Field", "desc": "Ki begins with surviving enough fights to know where the next one is coming from. The reading comes after.", "path": "Ki"}, {"name": "Hold The Layer", "desc": "Mana control is not cast, it is held, and holding it is learned under pressure.", "path": "Mana"}, {"name": "Something Is Watching", "desc": "A spirit has taken an interest. It has not agreed to anything yet, and it will not until it has seen you fight.", "path": "Spirit"}, {"name": "The Voice In The Grimoire", "desc": "Something has spoken from the book since the day it found you. It makes no offer until there is enough blood on your hands to be worth one.", "path": "Devil"}], "bosses": [{"id": "mars", "name": "Mars", "epithet": "Shining General of the Diamond Kingdom", "group": "Villain / world boss"}, {"id": "ancient_demon", "name": "Ancient Demon", "epithet": "A calamity from below", "group": "Villain / world boss"}, {"id": "vetto", "name": "Vet  "Hidden by shadow"}, {"id": "no_abilities", "name": "No Abilities", "desc": "Spells and moves disabled"}, {"id": "no_build", "name": "No Build", "desc": "Cannot place or break blocks"}, {"id": "no_physical", "name": "No Physical Damage", "desc": "Immune to physical damage"}, {"id": "knockback_resistance", "name": "Knockback Resistance", "desc": "Resist knockback"}, {"id": "tornado_resist", "name": "Tornado Resist", "desc": "Immune to wind pull"}, {"id": "poison_nullify", "name": "Poison Nullify", "desc": "Immune to poison"}, {"id": "set_damage", "name": "Set Damage", "desc": "Internal: fixed damage"}, {"id": "send_back_to_world", "name": "Send Back to World", "desc": "Internal: return to overworld"}, {"id": "wait", "name": "Wait", "desc": "Internal: hold in place"}, {"id": "xp_bottle_used", "name": "XP Bottle Used", "desc": "Cooldown on XP bottles"}, {"id": "mana_flow", "name": "Mana Flow", "desc": "Faster mana regeneration (buff)"}, {"id": "arcane_focus", "name": "Arcane Focus", "desc": "Spell power buff"}], "structures": [{"id": "hage_village", "name": "Hage Village"}, {"id": "farmstead", "name": "Outlying Farmstead"}, {"id": "spirit_grove", "name": "Spirit Grove"}, {"id": "magic_beast_den", "name": "Magic Beast Den"}, {"id": "yami_dojo", "name": "Yami's Dojo"}, {"id": "mana_spring", "name": "Mana Spring Shrine"}, {"id": "bandit_camp", "name": "Bandit Camp"}, {"id": "ruined_watchtower", "name": "Ruined Watchtower"}, {"id": "magic_knights_exam", "name": "Magic Knights Entrance Exam"}], "koth": ["North Ridge", "Eastern Mesa", "South Bluff"], "gamerules": [{"id": "blackcloverAnvilRenameGear", "name": "Anvils rename Black Clover gear", "desc": "Lets anvils rename Black Clover weapons and armor. Off by default, so only an Item Renamer can name them. Repairs and every other item work as usual."}, {"id": "blackcloverCustomCharacters", "name": "Custom characters", "desc": "Offers the character creator to any character that has not made a look yet, at their next login. On <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RAR = ['Legendary','Epic','Rare','Uncommon','Common'];
const G = D.grimoires.slice().sort((a,b) => (RAR.indexOf(a.rarity)+ (a.rarity==='Mythic'?-1:0)) - (RAR.indexOf(b.rarity)+(b.rarity==='Mythic'?-1:0)) || a.magic.localeCompare(b.magic));
const totalSpells = G.reduce((n,g) => n + g.spells.length, 0);
const pill = r => `<span class="pill r-${r}">${r}</span>`;
const fmtCd = c => c ? (c % 1 ? c.toFixed(1) : c) + ' s' : '—';
const titleCase = s => s.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function sigil(name, color, size=64){
  let h = hash(name); const rnd = () => ((h = Math.imul(h ^ (h>>>15), 2246822507) >>> 0) % 1000) / 1000;
  const n = [3,6,7,8,9,10][Math.floor(rnd()*6)], c = 50, out = [];
  const poly = (r, k, rot) => Array.from({length:k}, (_,i) => { const a = rot + i*2*Math.PI/k; return `${(c+r*Math.cos(a)).toFixed(1)},${(c+r*Math.sin(a)).toFixed(1)}`; }).join(' ');
  const rot = rnd()*Math.PI;
  out.push(`<circle cx="50" cy="50" r="46" fill="none" stroke="${color}" stroke-opacity=".55" stroke-width="1.2"/>`);
  out.push(`<circle cx="50" cy="50" r="41" fill="none" stroke="${color}" stroke-opacity=".3" stroke-width=".8" stroke-dasharray="${(2+rnd()*4).toFixed(1)} ${(2+rnd()*5).toFixed(1)}"/>`);
  out.push(`<polygon points="${poly(36, n, rot)}" fill="none" stroke="${color}" stroke-width="1.6"/>`);
  if (rnd() > .35) out.push(`<polygon points="${poly(36, n, rot + Math.PI/n)}" fill="none" stroke="${color}" stroke-opacity=".5" stroke-width="1"/>`);
  const inner = 10 + rnd()*12;
  for (let i=0;i<n;i++){ const a = rot + i*2*Math.PI/n; out.push(`<line x1="${(c+inner*Math.cos(a)).toFixed(1)}" y1="${(c+inner*Math.sin(a)).toFixed(1)}" x2="${(c+36*Math.cos(a)).toFixed(1)}" y2="${(c+36*Math.sin(a)).toFixed(1)}" stroke="${color}" stroke-opacity=".45" stroke-width=".9"/>`); }
  out.push(`<circle cx="50" cy="50" r="${inner.toFixed(1)}" fill="${color}" fill-opacity=".18" stroke="${color}" stroke-width="1.4"/>`);
  out.push(`<circle cx="50" cy="50" r="${(inner/3).toFixed(1)}" fill="${color}"/>`);
  return `<svg class="sigil" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${out.join('')}</svg>`;
}
const initials = s => s.replace(/^(Sir|Lady|Queen|Countess|Warden|Mother|Brother|Sister)\s+/,'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const MAXCD = Math.max(...D.grimoires.flatMap(g=>g.spells.map(s=>s.cooldown||0)));
const MAXMANA = Math.max(...D.grimoires.flatMap(g=>g.spells.map(s=>s.mana||0)));
function startHero(){
  const cv = document.getElementById('heroCanvas'); if(!cv) return;
  const ctx = cv.getContext('2d'); const dpr = Math.min(2, devicePixelRatio||1);
  const fit = () => { cv.width = cv.offsetWidth*dpr; cv.height = cv.offsetHeight*dpr; };
  fit();
  const cols = ['217,178,94','94,168,240','184,132,234','236,95,99'];
  const P = Array.from({length: 70}, () => ({x:Math.random(), y:Math.random(), r:.6+Math.random()*1.8, v:.0004+Math.random()*.0012, c:cols[Math.floor(Math.random()*cols.length)], p:Math.random()*6.28}));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(t){
    if(!document.body.contains(cv)) return;
    if (cv.width !== cv.offsetWidth*dpr) fit();
    const w=cv.width,h=cv.height; ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w*.82,h*.5); ctx.rotate(t/40000);
    for (let k=0;k<3;k++){ const R=(70+k*46)*dpr; ctx.strokeStyle=`rgba(217,178,94,${.16-k*.04})`; ctx.lineWidth=dpr; ctx.setLineDash(k===1?[4*dpr,7*dpr]:[]);
      ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke(); }
    ctx.setLineDash([]); ctx.beginPath();
    for(let i=0;i<=7;i++){ const a=i*2*Math.PI/7*3; ctx.lineTo(Math.cos(a)*116*dpr, Math.sin(a)*116*dpr);} ctx.strokeStyle='rgba(217,178,94,.12)'; ctx.stroke();
    ctx.restore();
    for(const q of P){ if(!still){ q.y -= q.v; if(q.y<-.05){q.y=1.05;q.x=Math.random();} }
      const a = .35+.35*Math.sin(t/900+q.p);
      ctx.fillStyle=`rgba(${q.c},${a})`; ctx.beginPath(); ctx.arc(q.x*w,q.y*h,q.r*dpr,0,7); ctx.fill(); }
    if(!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

V.races = () => {
  const tot = D.races.reduce((n,r)=>n+r.weight,0);
  return `<h1>Races</h1><p class="lede">Your race is rolled when your character is created. It changes your stat limits, your Dash and Leap, and what you can unlock.</p>
  <div class="grid">${D.races.map((r,i) => `<div class="card race stripe" style="--acc:${['#d9b25e','#5ea8f0','#74c47a','#ec5f63'][i]}"><div class="row" style="justify-content:space-between;align-items:flex-end"><h3 style="font-size:22px">${r.name}</h3><span class="big">${r.weight}%</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${100*r.weight/tot}%"></i></div>
    <p>${esc(r.desc)}</p>
    <div class="mv"><p><b>Dash</b> · ${esc(r.dash)}</p><p><b>Leap</b> · ${esc(r.leap)}</p></div></div>`).join('')}</div>
  <h2>Stat caps</h2>
  <p>Base caps for every race. Elves and Devils raise their own specialty caps, as listed above.</p>
  <div class="tablewrap"><table><thead><tr><th>Stat</th><th>Base cap</th><th>Race bonus</th></tr></thead><tbody>
    <tr><td>Max Mana</td><td class="num">25,000</td><td>Elf: +12,500 start, cap ×1.5</td></tr>
    <tr><td>Mana Regen</td><td class="num">75</td><td>Elf: +25 start, cap 100</td></tr>
    <tr><td>Health</td><td class="num">300</td><td>Devil: +150 start, cap ×1.5</td></tr>
    <tr><td>Magic Damage / Defense</td><td class="num">50%</td><td>Elf: +25% start, cap 65%</td></tr>
    <tr><td>Physical Damage / Defense</td><td class="num">50%</td><td>Devil: +25% start, cap 65%</td></tr>
  </tbody></table></div>
  <div class="note" style="margin-top:14px">A Dwarf receives a second grimoire, always different from the first. Only Humans can take the Devil path.</div>`;
};

V.modes = () => `<h1>Modes & paths</h1><p class="lede">Modes are power-up states you raise through use. They are grouped into four paths, each with its own quest line.</p>
  <div class="grid">${D.paths.map(p => `<div class="card stripe"><h3>${esc(p.name)} path</h3><p>${esc(p.blurb)}</p></div>`).join('')}</div>
  <h2>Modes</h2>
  <div class="tablewrap"><table><thead><tr><th>Mode</th><th>Kind</th><th>Path</th><th>Mana to enter</th><th>Mana drain</th><th>Devil power</th></tr></thead><tbody>
  ${D.modes.map(m => `<tr><td><b>${m.name}</b></td><td>${m.kind}</td><td>${m.path}</td><td class="num">${m.mana||'—'}</td><td class="num">${m.drain? m.drain+'/s':'—'}</td><td class="num">${m.mult==='—'?'—':'×'+m.mult}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="tag">Spirit modes have unique versions for Wind and Water grimoires. Mana values are read from the mode definitions in the code.</p>
  <h2>Path quests</h2>
  <div class="grid">${D.story.map(s => `<div class="card"><span class="tag">${s.path} path · first quest</span><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p></div>`).join('')}</div>`;

V.grimoires = () => {
  const order = ['All','Legendary','Epic','Rare','Uncommon','Common','Mythic'];
  return `<h1>Grimoires</h1><p class="lede">Every grimoire in the codex, sorted from rarest to most common. Each one has five spells. Fire, Water, Wind and Anti-Magic also have three extra spells.</p>
  <div class="filters" role="group" aria-label="Filter by rarity">${order.map((r,i)=>`<button data-r="${r}" aria-pressed="${i===0}">${r}</button>`).join('')}</div>
  <div class="grid" id="ggrid">${G.map(gcard).join('')}</div>`;
};
function gcard(g){ return `<a class="card gcard glow-${g.rarity}" data-r="${g.rarity}" href="#grimoire-${g.id}" style="--acc:${g.accent}">
   <div class="gtop">${sigil(g.magic, g.accent, 70)}${pill(g.rarity)}<span class="pct">${g.chance? g.chance+'%':'—'}</span></div>
   <div class="gbody"><h3>${esc(g.magic)}</h3><span class="tag">${esc(g.wielder)} · ${g.spells.length} spells</span><p>${esc(g.doctrine)}</p></div></a>`; }
function afterGrimoires() {
  document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x===b));
    document.querySelectorAll('#ggrid .card').forEach(c => c.style.display = (b.dataset.r==='All' || c.dataset.r===b.dataset.r) ? '' : 'none');
  });
}

function grimoirePage(g) {
  const i = G.indexOf(g), prev = G[(i-1+G.length)%G.length], next = G[(i+1)%G.length];
  const cds = g.spells.map(s=>s.cooldown).filter(Boolean); const avg = cds.length? Math.round(cds.reduce((a,b)=>a+b,0)/cds.length):0;
  return `<div class="crumbs"><a href="#grimoires">Grimoires</a> › ${esc(g.magic)}</div>
  <section class="ghero" style="--acc:${g.accent}">
    <div class="sigilwrap">${sigil(g.magic, g.accent, 96)}</div>
    <div><div class="row">${pill(g.rarity)}<span class="tag">Modelled on ${esc(g.wielder)}</span></div>
      <h1>${esc(g.magic)}</h1><p class="lede">${esc(g.doctrine)}</p>
      <div class="gfacts"><div><b>${g.spells.length}</b><span>Spells</span></div><div><b>${g.chance? g.chance+'%':'—'}</b><span>Ceremony chance</span></div><div><b>${avg? avg+' s':'—'}</b><span>Avg cooldown</span></div></div></div>
  </section>
  <div class="spells">${g.spells.map((s,j) => `<article class="spell" style="--acc:${g.accent}" id="s-${g.id}-${j}">
    <div class="head"><span class="num">${j<5? j+1 : '+'}</span><div class="titles"><h3>${esc(s.name)}</h3><span class="tag">${esc(s.tag)} · ${j<5?'Slot '+(j+1):'Extra spell '+(j-4)}</span></div></div>
    <p>${esc(s.summary)}</p>
    <dl class="chips">
      <div class="chip"><dt>Damage</dt><dd>${esc(s.damage)}</dd></div>
      <div class="chip"><dt>Range / area</dt><dd>${esc(s.range)}</dd></div>
      <div class="chip"><dt>Duration</dt><dd>${esc(s.duration)}</dd></div>
      <div class="chip"><dt>Cooldown</dt><dd>${fmtCd(s.cooldown)}</dd><div class="meter" aria-hidden="true"><i style="width:${100*(s.cooldown||0)/MAXCD}%"></i></div></div>
      ${s.mana?`<div class="chip"><dt>Mana</dt><dd>${s.mana}</dd><div class="meter" aria-hidden="true"><i style="width:${100*s.mana/MAXMANA}%"></i></div></div>`:''}
    </dl>
    ${j>=5?'<span class="gated">Extra spell: unlocked through progression</span>':''}</article>`).join('')}</div>
  <nav class="pager" aria-label="Other grimoires"><a href="#grimoire-${prev.id}"><span>‹ Previous</span>${esc(prev.magic)}</a><a href="#grimoire-${next.id}"><span>Next ›</span>${esc(next.magic)}</a></nav>`;
}

V.spells = () => {
  const rows = G.flatMap(g => g.spells.map((s,j)=>({g,s,j})));
  return `<h1>Spell index</h1><p class="lede">All ${rows.length} spells in one table. Click a heading to sort.</p>
  <div class="tablewrap"><table id="st"><thead><tr>${['Spell','Magic','Type','Damage','Cooldown','Mana'].map((h,i)=>`<th><button data-c="${i}">${h}</button></th>`).join('')}</tr></thead>
  <tbody>${rows.map(({g,s,j}) => `<tr><td><a href="#grimoire-${g.id}">${esc(s.name)}</a></td><td>${esc(g.magic)}</td><td>${esc(s.tag)}</td><td>${esc(s.damage)}</td><td class="num" data-v="${s.cooldown}">${fmtCd(s.cooldown)}</td><td class="num" data-v="${s.mana}">${s.mana||'—'}</td></tr>`).join('')}</tbody></table></div>`;
};
function afterSpells() {
  let dir = 1, last = -1;
  document.querySelectorAll('#st th button').forEach(b => b.onclick = () => {
    const c = +b.dataset.c; dir = (c===last) ? -dir : 1; last = c;
    const tb = $('#st tbody'); const rs = [...tb.rows];
    rs.sort((a,b) => { const x=a.cells[c], y=b.cells[c];
      if (x.dataset.v!=null) return (parseFloat(x.dataset.v)-parseFloat(y.dataset.v))*dir;
      return x.textContent.localeCompare(y.textContent)*dir; });
    rs.forEach(r => tb.appendChild(r));
  });
}

V.effects = () => `<h1>Status effects</h1><p class="lede">Effects the mod adds. Spells apply most of them. Some are internal effects used by gamemodes.</p>
  <div class="tablewrap"><table><thead><tr><th>Effect</th><th>Summary</th></tr></thead><tbody>
  ${D.effects.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.desc)}</td></tr>`).join('')}</tbody></table></div>
  <p class="tag">The summaries here are short readings of each effect's name and use in the code. In game, the tooltip is the source of truth.</p>`;

V.bosses = () => {
  const groups = ['Villain / world boss','Magic Knight challenger','Labyrinth room boss'];
  const blurbs = {'Villain / world boss':'Story antagonists, world bosses and the raid boss.','Magic Knight challenger':'Magic Knights you can duel in quests and the Tower.','Labyrinth room boss':'Original bosses that guard rooms in the Labyrinth.'};
  return `<h1>Bosses & NPCs</h1><p class="lede">Every named boss, with the title shown on its boss bar.</p>
  ${groups.map(gr => `<h2>${gr}s</h2><p class="tag">${blurbs[gr]}</p><div class="grid">${D.bosses.filter(b=>b.group===gr).map(b=>`<div class="card boss" style="--acc:${{'Villain / world boss':'#ec5f63','Magic Knight challenger':'#d9b25e','Labyrinth room boss':'#b884ea'}[gr]}"><span class="mono-badge">${esc(initials(b.name))}</span><div><h3>${esc(b.name)}</h3><p>${esc(b.epithet)}</p></div></div>`).join('')}</div>`).join('')}
  <h2>Common mobs</h2><p>Bandit, Mage, Witch, Swordsman, Wolf, Sand Wyrm, Grimoire Wizard, Spade Kingdom Soldier, Corrupted Mage, Earth Golem and Training Dummy. Townsfolk and Magic Knight NPCs fill towns and the Tower.</p>`;
};

  <h2>Server events</h2>
  <div class="grid">${D.events.map(e=>`<div class="card stripe"><h3>${esc(e.name)}</h3><p>${esc(e.desc)}</p></div>`).join('')}</div>
  <p class="tag">King of the Hill forts: ${D.koth.join(', ')}.</p>
  <h2>Gamemodes</h2>
  <div class="grid">
    <div class="card"><h3>Tower</h3><p>A floor-by-floor climb with fights, puzzles and rewards. Start a climb from the Gamemodes page.</p></div>
    <div class="card"><h3>Labyrinth</h3><p>A three-level maze with turrets, flame vents, hidden runes and spike pits. Room bosses guard the way down.</p></div>
    <div class="card"><h3>Dungeons</h3><p>Instanced runs that end with a boss. You count as clearing one only if you are inside when the boss falls.</p></div>

    <div class="card"><h3>Season War</h3><p>A season-long conflict between squads, with objectives, stages and a hall of champions.</p></div>
  </div>
  <h2>Squad perks</h2>
  <div class="grid">${D.perks.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p></div>`).join('')}</div>`;

V.quests = () => `<h1>Quests</h1><p class="lede">Daily and weekly quests reset on their own schedule. Path quests open the mode paths.</p>
  ${['Daily','Weekly'].map(t=>`<h2>${t}</h2><div class="tablewrap"><table><thead><tr><th>Quest</th><th>Objective</th><th>Description</th></tr></thead><tbody>
  ${D.quests.filter(q=>q.type===t).map(q=>`<tr><td><b>${esc(q.name)}</b></td><td>${esc(q.obj)}</td><td>${esc(q.desc)}</td></tr>`).join('')}</tbody></table></div>`).join('')}
  <h2>Path quests</h2><div class="grid">${D.story.map(s=>`<div class="card"><span class="tag">${s.path}</span><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p></div>`).join('')}</div>
  <p class="tag">In 0.3.2 each path has only its first quest. The code marks the full ten-quest lines as placeholders.</p>`;

V.places = () => `<h1>Structures</h1><p class="lede">Landmarks that generate in the world. Most story quests take place at one of them.</p>
  <div class="grid">${D.structures.map(s=>`<div class="card"><h3>${esc(s.name)}</h3></div>`).join('')}
  <div class="card"><h3>Black Bulls' Hideout</h3><p>Squad base. Generates when the structures gamerule is on.</p></div>
  <div class="card"><h3>Grimoire Tower</h3><p>Where the ceremony happens. It always generates.</p></div>
  <div class="card"><h3>Royal Capital</h3><p>Protected out to 500 blocks when structure protection is on.</p></div></div>
  <h2>Fast travel</h2><p>Waypoints work only in the Overworld. Hold still during the countdown: the teleport is cancelled if you move, are attacked, or are escorting someone.</p>`;

V.gear = () => `<h1>Armor & brooms</h1><p class="lede">${D.armor.length} armor sets, from basic mob drops to devil-union gear and squad uniforms.</p>
  <div class="grid">${D.armor.map(a=>`<div class="card"><h3>${esc(titleCase(a.id.replace(/_armor$/,'')))}</h3><p>${a.pieces.map(esc).join(' · ')}</p></div>`).join('')}</div>
  <h2>Broom upgrades</h2><div class="tablewrap"><table><thead><tr><th>Stat</th><th>Effect</th></tr></thead><tbody>${D.broomstats.map(b=>`<tr><td><b>${b.name}</b></td><td>${esc(b.desc)}</td></tr>`).join('')}</tbody></table></div>
  <h2>Broom models</h2><div class="grid">${D.brooms.map(b=>`<div class="card"><h3>${esc(b.name)}</h3><p>${esc(b.desc)}</p></div>`).join('')}</div>`;

V.commands = () => `<h1>Commands</h1><p class="lede">All commands are for operators except <code>/party</code>. Most take a player target. Use tab completion in game for the full syntax.</p>
  <div class="tablewrap"><table><thead><tr><th>Command</th><th>Subcommands</th><th>Purpose</th></tr></thead><tbody>
  ${D.commands.map(c=>`<tr><td><code>/${c.cmd}</code>${c.admin?'':' <span class="pill r-Uncommon">player</span>'}</td><td class="mono" style="font-size:13px">${esc(c.subs)||'—'}</td><td>${esc(c.desc)}</td></tr>`).join('')}</tbody></table></div>`;

V.gamerules = () => `<h1>Gamerules</h1><p class="lede">Set these with <code>/gamerule &lt;name&gt; &lt;value&gt;</code>.</p>
  <div class="tablewrap"><table><thead><tr><th>Gamerule</th><th>What it does</th></tr></thead><tbody>
  ${D.gamerules.map(g=>`<tr><td><code>${g.id}</code><br><span class="tag">${esc(g.name)}</span></td><td>${esc(g.desc)}</td></tr>`).join('')}</tbody></table></div>`;

function search(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return null;
  const hits = [];
  G.forEach(g => { if (g.magic.toLowerCase().includes(q) || g.wielder.toLowerCase().includes(q)) hits.push(['Grimoire', g.magic, '#grimoire-'+g.id]);
    g.spells.forEach(s => { if ((s.name+' '+s.summary).toLowerCase().includes(q)) hits.push(['Spell', `${s.name} <span class="tag">· ${esc(g.magic)}</span>`, '#grimoire-'+g.id]); }); });
  D.bosses.forEach(b => { if ((b.name+' '+b.epithet).toLowerCase().includes(q)) hits.push(['Boss', esc(b.name), '#bosses']); });
  D.modes.forEach(m => { if (m.name.toLowerCase().includes(q)) hits.push(['Mode', m.name, '#modes']); });
  D.events.forEach(e => { if ((e.name+' '+e.desc).toLowerCase().includes(q)) hits.push(['Event', esc(e.name), '#events']); });
  D.effects.forEach(e => { if (e.name.toLowerCase().includes(q)) hits.push(['Effect', esc(e.name), '#effects']); });
  D.armor.forEach(a => { if (a.pieces.join(' ').toLowerCase().includes(q)) hits.push(['Armor', esc(titleCase(a.id.replace(/_armor$/,''))), '#gear']); });
  D.commands.forEach(c => { if ((c.cmd+' '+c.desc).toLowerCase().includes(q)) hits.push(['Command', '/'+c.cmd, '#commands']); });
  return `<h1>Search: “${esc(q)}”</h1><p class="lede">${hits.length} result${hits.length===1?'':'s'}.</p>
   <div class="hits">${hits.slice(0,200).map(([t,l,h])=>`<div class="hit"><span class="pill plain" style="color:var(--brass)">${t}</span><a href="${h}">${l}</a></div>`).join('') || '<p>No matches. Try a spell name, magic type or boss.</p>'}</div>`;
}

function route() {
  const id = (location.hash || '#home').slice(1);
  let html;
  if (id.startsWith('grimoire-')) { const g = G.find(x => 'grimoire-'+x.id === id); html = g ? grimoirePage(g) : V.grimoires(); }
  else html = (V[id] || V.home)();
  $('#main').innerHTML = `<div class="fade">` + html + `</div><footer>Built from the decompiled Black Clover mod v0.3.2 (author: Vez). Numbers come from the in-game Spell Codex and may change between versions.</footer>`;
  renderNav(V[id] || id.startsWith('grimoire-') ? id : 'home');
  if (id === 'grimoires') afterGrimoires();
  if (id === 'spells') afterSpells();
  if (id === 'home' || !V[id] && !id.startsWith('grimoire-')) { try { startHero(); } catch (e) {} }
  $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
}
$('#q').addEventListener('input', e => { const r = search(e.target.value); if (r) { $('#main').innerHTML = r; } else route(); });
$('#menuBtn').onclick = () => { const o = $('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', o); };
window.addEventListener('hashchange', () => { $('#q').value=''; route(); });
route();
</script>
</body>
</html>
